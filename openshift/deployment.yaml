apiVersion: apps/v1
kind: Deployment
metadata:
  name: devspaces-multicluster-redirector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devspaces-multicluster-redirector
  template:
    metadata:
      labels:
        app: devspaces-multicluster-redirector
    spec:
      serviceAccountName: devspaces-multicluster-redirector
      containers:
        - name: devspaces-multicluster-redirector
          image: quay.io/redhat-developer/devspaces-multicluster-redirector:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: group-mapping
              mountPath: /etc/config
              readOnly: true
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9@sha256:4da6381f4f79de6a6024554aa99129e9b79b7ad7fdde0b0bebbcb87421a97d7c
          ports:
            - containerPort: 8443
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -c
            - |
              exec /usr/bin/oauth-proxy \
                -provider=openshift \
                -http-address=:8443 \
                -https-address= \
                -email-domain=* \
                -upstream=http://localhost:8080 \
                -scope=user:info \
                -pass-user-headers \
                -openshift-service-account=devspaces-multicluster-redirector \
                -openshift-ca=/etc/pki/trusted-ca/ca-bundle.crt \
                -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                -client-id=system:serviceaccount:${NAMESPACE}:devspaces-multicluster-redirector \
                -client-secret-file=/var/run/secrets/kubernetes.io/serviceaccount/token \
                -cookie-secret-file=/etc/proxy/secrets/session_secret
          volumeMounts:
            - name: session-secret
              mountPath: /etc/proxy/secrets
            - name: trusted-ca
              mountPath: /etc/pki/trusted-ca
              readOnly: true
      volumes:
        - name: session-secret
          secret:
            secretName: devspaces-multicluster-redirector-session-secret
        # Injected by the Cluster Network Operator: system CAs + any custom CA
        # from the cluster-wide proxy config. See trusted-ca-configmap.yaml.
        - name: trusted-ca
          configMap:
            name: devspaces-multicluster-redirector-trusted-ca
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
        - name: group-mapping
          configMap:
            name: devspaces-openshift-group-mapping
